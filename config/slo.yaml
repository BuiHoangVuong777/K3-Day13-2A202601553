service: day13-observability-lab
window: 28d
slis:
  latency_p95_ms:
    objective: 3000
    target: 99.5
    note: "Baseline khoảng 150 ms; rag_slow đẩy P95 lên khoảng 2650 ms. SLO 3000 ms theo dashboard, alert sớm tại 2000 ms; target 99.5% cho phép tối đa 0.5% cửa sổ đo vi phạm"
  error_rate_pct:
    objective: 2
    target: 99.0
    note: "tool_fail tạo error rate 33.33%; mục tiêu giữ error rate không vượt quá 2%, target 99% cho phép tối đa 1% cửa sổ đo vi phạm"
  cost_usd_60m:
    objective: 2.5
    target: 100.0
    note: "Baseline khoảng 0.1212 USD cho 90 request; 2.5 USD là hard budget nên target 100% cửa sổ 60 phút phải đạt"
  tokens_total_60m:
    objective: 50000
    target: 100.0
    note: "Baseline khoảng 9.6 nghìn token cho 90 request; ngưỡng 50000 token trong 60 phút đồng bộ với dashboard và dùng để phát hiện prompt hoặc vòng lặp sinh token bất thường"
  quality_score_avg:
    objective: 0.75
    target: 95.0
    note: "Baseline quality trung bình 0.88; target 95% cho phép 5% cửa sổ dao động vì quality chỉ là proxy"
