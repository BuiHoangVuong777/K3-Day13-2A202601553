alerts:
  - name: HighUserLatency
    severity: high
    condition: latency_p95_ms > 2000 for 5m
    type: symptom-based
    owner: "sre-alerts (ChiQuang - Người 4)"
    runbook: docs/alerts.md#alert-1
  - name: HighRequestErrorRate
    severity: critical
    condition: error_rate_pct > 2 for 5m
    type: symptom-based
    owner: "sre-alerts (ChiQuang - Người 4)"
    runbook: docs/alerts.md#alert-2
  - name: CostBudgetAtRisk
    severity: warning
    condition: cost_usd_60m > 2.5 for 5m
    type: symptom-based
    owner: "sre-alerts (ChiQuang - Người 4)"
    runbook: docs/alerts.md#alert-3
